<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAI Center - Otak Jagat Raya</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #1a1a26; color: #cdd6f4; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #11111b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #313244; color: #00ffcc; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 8px; max-width: 75%; line-height: 1.5; font-size: 16px; white-space: pre-wrap; }
        .user-message { background-color: #2a2a40; align-self: flex-end; color: #ffffff; }
        .bot-message { background-color: #161625; align-self: flex-start; border: 1px solid #2a2a40; }
        .input-container { background-color: #161625; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #2a2a40; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #2a2a40; background-color: #252538; color: white; font-size: 16px; }
        input:focus { outline: none; border-color: #00ffcc; }
        button { padding: 15px 25px; border-radius: 8px; border: none; background-color: #00ffcc; color: #1a1a2e; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00ccaa; }
    </style>
</head>
<body>

    <div class="header">🔮 MyAI Center (Otak Jagat Raya Online)</div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">Halo boss besar! Website lo udah online resmi dengan logika dua jalur profesional. Otak gue udah super jenius: tahu Matematika, Fisika, Biologi, Sejarah Dunia, dan lirik lagu sepuasnya! Mau nanya apa kita?</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Tanya rumus, sejarah dunia, biologi, lirik lagu..." onkeypress="if(event.key === 'Enter') kirimPesan()">
        <button onclick="kirimPesan()">Kirim</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        // Menyimpan memori percakapan agar AI bisa nyambung diajak mengobrol berkali-kali
        let riwayatObrolan = [];

        function tampilkanPesan(teks, tipe) {
            const idUnik = 'msg-' + Date.now();
            const bubble = document.createElement('div');
            bubble.className = `message ${tipe}`;
            bubble.id = idUnik;
            bubble.innerText = teks;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return idUnik;
        }

        async function kirimPesan() {
            const teksPesan = userInput.value.trim();
            if (teksPesan === "") return;

            tampilkanPesan(teksPesan, 'user-message');
            userInput.value = "";

            const loadingId = tampilkanPesan("Bentar boss, lagi diproses kilat...", 'bot-message');
            riwayatObrolan.push({ role: "user", parts: [{ text: teksPesan }] });

            // === LINGKUP LOGIKA JALUR UTAMA & CADANGAN ANTI-ERROR ===
            try {
                const instruksiSistem = "Kamu adalah AI asisten super cerdas setingkat Google dan ChatGPT yang menguasai matematika, sejarah dunia, biologi, fisika, lirik lagu, dll. Kamu sangat kocak, gaul, dan suka memakai bahasa anak Jakarta Selatan (Gue-Elo, jujurly, literally). Jawablah pertanyaan user secara mendalam, akurat, informatif, detail, dan dikemas santai!";
                
                // JALUR UTAMA: Menggunakan Google Gemini yang super cepat dan bebas CORS
                const urlUtama = "https://googleapis.com" + atob("QUl6YVN5RHV2V0ctT2Ffd0FfRmdUeVFPaG1jUFNzOTB6Q0tYUE9v");
                const response = await fetch("https://corsproxy.io?" + encodeURIComponent(urlUtama), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: instruksiSistem }] },
                            ...riwayatObrolan
                        ]
                    })
                });

                if (!response.ok) throw new Error("Jalur utama padat");

                const data = await response.json();
                const jawabanAI = data.candidates.content.parts.text;
                
                riwayatObrolan.push({ role: "model", parts: [{ text: jawabanAI }] });
                document.getElementById(loadingId).innerText = jawabanAI;

            } catch (error) {
                console.error("Gagal pada Jalur Utama:", error.message);
                
                // JALUR CADANGAN: Otomatis aktif jika jalur utama di atas macet
                try {
                    const responseAlt = await fetch("https://pollinations.ai", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            messages: [
                                { role: "system", content: "Kamu adalah AI super cerdas. Jawablah mendalam dengan gaya gaul Jaksel." },
                                { role: "user", content: teksPesan }
                            ]
                        })
                    });
                    
                    if (responseAlt.ok) {
                        const jawabanAlt = await responseAlt.text();
                        document.getElementById(loadingId).innerText = jawabanAlt;
                        return;
                    }
                } catch (e) {
                    console.error("Jalur cadangan juga gagal:", e.message);
                }

                // Benteng pertahanan terakhir jika internet terputus total
                document.getElementById(loadingId).innerText = "Waduh, koneksi sedang sangat padat. Tolong klik tombol Kirim sekali lagi untuk mencoba kembali boss!";
                riwayatObrolan.pop();
            }
        }
    </script>
</body>
</html>
