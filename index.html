<script>
    // Fungsi pembantu agar bisa kirim pesan saat klik enter
    function handleKeyPress(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault(); 
            kirimPesan();
        }
    }

    async function kirimPesan() {
        const inputElement = document.getElementById("inputPesan");
        const teksPesan = inputElement.value.trim();
        const boxJawaban = document.getElementById("boxJawaban");
        const btnKirim = document.getElementById("btnKirim");

        // Validasi input jika kosong
        if (!teksPesan) {
            alert("Ketik pertanyaan elo dulu dong, jangan kosong gitu!");
            return;
        }

        // Setup UI saat loading berpikir
        boxJawaban.innerHTML = '<span class="loading">Wait... gue lagi scrolling pustaka global dulu buat nyari jawaban terbaik...</span>';
        btnKirim.disabled = true;
        btnKirim.innerText = "Processing...";

        // Doktrin Karakter AI Jaksel buatan Kak Vita
        const systemPrompt = "Kamu adalah asisten AI super pintar buatan Kak Vita yang menguasai semua ilmu pengetahuan (bisa bikin lirik lagu, matematika, biologi, fisika, sejarah nasional/dunia, dll). Kamu sangat kocak, gaul, dan suka memakai bahasa anak Jakarta Selatan (Gue-Elo, jujurly, literally). Jawablah pertanyaan dengan data asli, detail, mendalam dan akurat, namun dikemas santai!";

        // Endpoint resmi text generator Pollinations AI
        const apiUrl = "https://pollinations.ai";

        try {
            // Menggunakan metode POST dengan JSON payload agar terhindar dari typo URL
            const response = await fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: teksPesan }
                    ],
                    model: "openai", // Menggunakan model basis teks performa tinggi
                    jsonMode: false
                })
            });

            if (!response.ok) {
                throw new Error(`Server ngadat nih (Status: ${response.status})`);
            }

            // Membaca hasil respon teks langsung dari server
            const jawabanAI = await response.text();

            if (!jawabanAI || jawabanAI.trim() === "") {
                throw new Error("Respon yang diterima kosong melompong.");
            }

            // Masukkan teks ke box jawaban dan kosongkan input textarea
            boxJawaban.innerText = jawabanAI.trim();
            inputElement.value = ""; 

        } catch (error) {
            // Konsol diamankan menggunakan warn agar TIDAK MERAH di browser
            console.warn("Laporan Sistem:", error.message);
            
            // Tampilkan pesan error yang ramah di UI
            boxJawaban.innerHTML = `<span style="color: #ff4757;"><b>Jujurly ada kendala jaringan:</b> ${error.message}<br><br>Servernya lagi hectic banget, elo coba klik tombol <b>Tanya AI</b> sekali lagi deh boss biar gue jemput ulang jawabannya!</span>`;
        } finally {
            // Kembalikan tombol kirim ke status aktif semula
            btnKirim.disabled = false;
            btnKirim.innerText = "Tanya AI";
        }
    }
</script>
