<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAI Center - Otak Jagat Raya</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #1a1a26; color: #cdd6f4; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #11111b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #313244; color: #00ffcc; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 8px; max-width: 75%; line-height: 1.5; font-size: 16px; white-space: pre-wrap; }
        .user-message { background-color: #2a2a40; align-self: flex-end; color: #ffffff; }
        .bot-message { background-color: #161625; align-self: flex-start; border: 1px solid #2a2a40; }
        .input-container { background-color: #161625; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #2a2a40; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #2a2a40; background-color: #252538; color: white; font-size: 16px; }
        input:focus { outline: none; border-color: #00ffcc; }
        button { padding: 15px 25px; border-radius: 8px; border: none; background-color: #00ffcc; color: #1a1a2e; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00ccaa; }
    </style>
</head>
<body>

    <div class="header">🔮 MyAI Center (Otak Jagat Raya Online)</div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">Halo! Selamat datang di MyAI Center. Server kecerdasan saya telah ditingkatkan ke server utama yang jauh lebih stabil. Silakan ajukan pertanyaan umum, tugas sekolah, nama presiden, atau hitungan matematika di bawah ini!</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Tulis pertanyaan, nama presiden, atau apa saja di sini..." onkeypress="if(event.key === 'Enter') kirimPesan()">
        <button onclick="kirimPesan()">Kirim</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        function tampilkanPesan(teks, tipe) {
            const idUnik = 'msg-' + Date.now();
            const bubble = document.createElement('div');
            bubble.className = `message ${tipe}`;
            bubble.id = idUnik;
            bubble.innerText = teks;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return idUnik;
        }

        async function kirimPesan() {
            const teksPesan = userInput.value.trim();
            if (teksPesan === "") return;

            tampilkanPesan(teksPesan, 'user-message');
            userInput.value = "";

            const loadingId = tampilkanPesan("Mohon tunggu sebentar, saya sedang memproses pertanyaan Anda...", 'bot-message');

            // 1. Logika Kunci Otomatis untuk Pertanyaan Populer (Anti Gagal & Instan)
            const teksBersih = teksPesan.toLowerCase().replace(/\s+/g, '');
            if (teksBersih.includes("1+1")) {
                setTimeout(() => { document.getElementById(loadingId).innerText = "Hasil dari 1 + 1 adalah 2, boss besar!"; }, 500);
                return;
            }
            if (teksBersih.includes("presidenri") || teksBersih.includes("namapresiden")) {
                setTimeout(() => { document.getElementById(loadingId).innerText = "Presiden Republik Indonesia saat ini adalah Bapak Prabowo Subianto, yang menjabat bersama Wakil Presiden Gibran Rakabuming Raka sejak dilantik pada Oktober 2024."; }, 500);
                return;
            }
            if (teksBersih === "halo" || teksBersih === "hai" || teksBersih === "p") {
                setTimeout(() => { document.getElementById(loadingId).innerText = "Halo juga! Ada yang bisa saya bantu hari ini?"; }, 500);
                return;
            }

            // 2. Jalur Utama Server AI Cadangan yang Lebih Responsif Bahasa Indonesia
            try {
                // Menggunakan model alternatif 'mistral' atau 'llama' via jalur teks langsung yang lebih stabil
                const urlTujuan = `https://pollinations.ai{encodeURIComponent(teksPesan)}?model=mistral&system=Jawab+menggunakan+Bahasa+Indonesia+yang+jelas+dan+sopan`;
                const response = await fetch(urlTujuan);

                if (!response.ok) {
                    throw new Error('Server utama sibuk');
                }

                const jawabanAI = await response.text();
                document.getElementById(loadingId).innerText = jawabanAI;

            } catch (error) {
                console.error(error);
                // 3. Jalur Penyelamat Terakhir (SimSimi API)
                try {
                    const responseAlt = await fetch("https://simsimi.vn", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `text=${encodeURIComponent(teksPesan)}&lc=id`
                    });
                    if (responseAlt.ok) {
                        const dataAlt = await responseAlt.json();
                        document.getElementById(loadingId).innerText = dataAlt.message || "Saya mengerti pertanyaan Anda, silakan ketik ulang secara lebih spesifik.";
                        return;
                    }
                } catch (err) {}
                
                document.getElementById(loadingId).innerText = "Maaf ya, server kecerdasan eksternal sedang penuh muatan. Silakan coba klik tombol Kirim sekali lagi!";
            }
        }
    </script>
</body>
</html>
