<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAI Center - Otak Jagat Raya</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #1a1a26; color: #cdd6f4; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #11111b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #313244; color: #00ffcc; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 8px; max-width: 75%; line-height: 1.5; font-size: 16px; white-space: pre-wrap; }
        .user-message { background-color: #2a2a40; align-self: flex-end; color: #ffffff; }
        .bot-message { background-color: #161625; align-self: flex-start; border: 1px solid #2a2a40; }
        .input-container { background-color: #161625; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #2a2a40; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #2a2a40; background-color: #252538; color: white; font-size: 16px; }
        input:focus { outline: none; border-color: #00ffcc; }
        button { padding: 15px 25px; border-radius: 8px; border: none; background-color: #00ffcc; color: #1a1a2e; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00ccaa; }
    </style>
</head>
<body>

    <div class="header">🔮 MyAI Center (ChatGPT Memory Edition)</div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">Halo boss besar! Kali ini otak gue udah dipasang fitur ingatan permanen. Gue gak bakal amnesia lagi dan bisa lo ajak mengobrol berkali-kali tanpa error! Mau nanya apa kita?</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Tanya apa saja berkali-kali, bebas..." onkeypress="if(event.key === 'Enter') kirimPesan()">
        <button onclick="kirimPesan()">Kirim</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        // WADAH RAHASIA UNTUK MENYIMPAN RIWAYAT OBROLAN AGAR AI TIDAK AMNESIA
        let riwayatObrolan = [];

        function tampilkanPesan(teks, tipe) {
            const idUnik = 'msg-' + Date.now();
            const bubble = document.createElement('div');
            bubble.className = `message ${tipe}`;
            bubble.id = idUnik;
            bubble.innerText = teks;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return idUnik;
        }

        async function kirimPesan() {
            const teksPesan = userInput.value.trim();
            if (teksPesan === "") return;

            tampilkanPesan(teksPesan, 'user-message');
            userInput.value = "";

            const loadingId = tampilkanPesan("Bentar boss, lagi mengingat-ingat obrolan kita...", 'bot-message');

            // Masukkan pesan baru user ke dalam ingatan array
            riwayatObrolan.push({ role: "user", parts: [{ text: teksPesan }] });

            try {
                // Gunakan instruksi sistem agar gaya bicaranya tetap gaul anak Jaksel
                const instruksiSistem = "Kamu adalah asisten AI super pintar, kocak, gaul, dan sering memakai bahasa anak Jakarta Selatan (Gue-Elo, jujurly, literally). Jawablah semua pertanyaan dengan data asli, faktual, detail dan akurat, namun dikemas santai!";
                
                const response = await fetch("https://corsproxy.io?" + encodeURIComponent("https://googleapis.com" + atob("QUl6YVN5RHV2V0ctT2Ffd0FfRmdUeVFPaG1jUFNzOTB6Q0tYUE9v")), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: instruksiSistem }] },
                            ...riwayatObrolan // Kirim seluruh riwayat obrolan dari awal sampai akhir agar AI ingat!
                        ]
                    })
                });

                const data = await response.json();
                const jawabanAI = data.candidates.content.parts.text;
                
                // Simpan juga jawaban AI ke dalam riwayat obrolan
                riwayatObrolan.push({ role: "model", parts: [{ text: jawabanAI }] });
                
                document.getElementById(loadingId).innerText = jawabanAI;

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).innerText = "Waduh boss, jalurnya tabrakan. Coba klik Kirim sekali lagi ya!";
                // Hapus input terakhir yang gagal dari memori agar tidak merusak antrean
                riwayatObrolan.pop();
            }
        }
    </script>
</body>
</html>
