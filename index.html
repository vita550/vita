<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google AI - Super Pintar Segala Bidang</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-top: 40px;
        }
        .logo-area {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }
        .logo-g { color: #4285F4; }
        .logo-o1 { color: #EA4335; }
        .logo-o2 { color: #FBBC05; }
        .logo-o3 { color: #4285F4; }
        .logo-l { color: #34A853; }
        .logo-e { color: #EA4335; }
        .logo-sub {
            font-size: 14px;
            color: #70757a;
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid #dadce0;
            border-radius: 12px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        textarea:focus {
            border: 1px solid #4285F4;
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
        }
        button {
            width: 100%;
            background-color: #1a73e8;
            color: white;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #dadce0;
            cursor: not-allowed;
        }
        .output-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #dadce0;
            min-height: 80px;
            white-space: pre-line;
            color: #202124;
            line-height: 1.6;
            font-size: 15px;
        }
        .loading-text {
            color: #70757a;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="logo-area">
        <span class="logo-g">G</span><span class="logo-o1">o</span><span class="logo-o2">o</span><span class="logo-o3">g</span><span class="logo-l">l</span><span class="logo-e">e</span><span class="logo-g">百科</span>
        <span class="logo-sub">Super AI Penjawab Segala Ilmu & Bidang</span>
    </div>
    
    <textarea id="inputPesan" placeholder="Tanyakan apa saja... (Matematika, Sejarah Islam, Kedokteran, Fisika, Biologi, Hukum, dll)"></textarea>
    <button id="btnKirim" onclick="kirimPesan()">Tanya Super AI</button>
    
    <div id="boxJawaban" class="output-box">
        Silakan ketik pertanyaan Anda. AI menguasai materi sekolah, universitas, sains, sejarah, dan ilmu umum lainnya.
    </div>
</div>

<script>
    async function kirimPesan() {
        const inputTeks = document.getElementById("inputPesan").value.trim();
        const boxJawaban = document.getElementById("boxJawaban");
        const btnKirim = document.getElementById("btnKirim");

        if (!inputTeks) {
            alert("Harap masukkan pertanyaan Anda terlebih dahulu!");
            return;
        }

        // Setup UI saat memproses data
        boxJawaban.innerHTML = '<span class="loading-text">Membuka pustaka data global, merangkai jawaban ensiklopedis...</span>';
        btnKirim.disabled = true;
        btnKirim.innerText = "Mencari Jawaban...";

        // Instruksi ketat agar AI bertindak sebagai pakar ensiklopedia multi-bidang
        const systemPrompt = "Kamu adalah AI Profesor Super Cerdas setingkat Google Search dan ChatGPT. Kamu menguasai semua bidang ilmu: matematika, sejarah dunia, sejarah islam, biologi, fisika, kimia, kedokteran, teknologi, geografi, dan materi sekolah/universitas. Jawablah pertanyaan user secara sangat mendalam, ilmiah, akurat, informatif, terstruktur, dan wajib menggunakan Bahasa Indonesia yang baku, formal, dan jelas.";
        
        try {
            // Menggunakan Endpoint Pollinations AI (Model Llama-3.1-405b tingkat tinggi & Gratis)
            const apiUrl = "https://pollinations.ai";
            
            // Format request POST ke Pollinations AI
            const response = await fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: inputTeks }
                    ],
                    model: "openai" // Menggunakan model teks performa tinggi berbasis web
                })
            });

            if (!response.ok) {
                throw new Error(`Koneksi server terputus (Status: ${response.status})`);
            }

            // Jalur ini mengembalikan teks jawaban secara langsung tanpa struktur JSON yang rumit
            const jawabanAI = await response.text();

            if (!jawabanAI || jawabanAI.trim() === "") {
                throw new Error("Respon yang diterima kosong.");
            }

            // Tampilkan hasil jawaban ke layar
            boxJawaban.innerText = jawabanAI.trim();

        } catch (error) {
            // Proteksi konsol agar tidak merah (crash), diganti dengan log peringatan
            console.warn("Laporan Sistem:", error.message);
            boxJawaban.innerHTML = `<span style="color: #d93025;"><b>Terjadi Gangguan Jaringan:</b> ${error.message}<br><br>Server global sedang penuh. Silakan klik tombol <b>Tanya Super AI</b> sekali lagi untuk mencoba jalur alternatif.</span>`;
        } finally {
            // Mengaktifkan kembali tombol kirim
            btnKirim.disabled = false;
            btnKirim.innerText = "Tanya Super AI";
        }
    }
</script>

</body>
</html>
